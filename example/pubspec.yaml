name: example
description: Try the Vatio Flutter SDK against your own workspace.
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.0
  shared_preferences: ^2.3.0
  url_launcher: ^6.3.0
  vatio:
    path: ../

dev_dependencies:
  flutter_lints: ">=4.0.0 <7.0.0"

flutter:
  uses-material-design: true
